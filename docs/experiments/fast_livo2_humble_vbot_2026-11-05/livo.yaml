      lidar_type: 8
      scan_line: 16
      point_filter_num: 1
      blind: 0.3
      filter_size_surf: 0.2
    imu:
      imu_en: true
      imu_int_frame: 20
      acc_cov: 0.1
      gyr_cov: 0.1
    vio:
      grid_size: 20
      grid_n_height: 18
      patch_size: 8
      patch_pyrimid_level: 3
      max_iterations: 5
