      max_iterations: 5
      voxel_size: 0.5
      max_layer: 2
      layer_init_num:
      - 5
      - 5
      - 5
      max_points_num: 50
      min_eigen_value: 0.0025
    publish:
      tf_en: false
      pub_scan_num: 1
      dense_map_en: false
      pub_plane_en: false
    pcd_save:
      pcd_save_en: true
      interval: -1
      filter_size_pcd: 0.15
    runtime:
      output_directory: /tmp/fast_livo_vbot/livo
