name: Build x86_64 (ROS 2 Humble)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tf_manager_ref:
        description: Omni TF Manager tag, branch, or commit
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      version:
        description: Artifact version (tag or commit)
        required: false
        type: string
      tf_manager_ref:
        description: Omni TF Manager tag, branch, or commit
        required: false
        default: main
        type: string

concurrency:
  group: x86-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    env:
      ROS_DISTRO: humble
      ROS_WS: /tmp/omni_slam_x86_ws
      DEBIAN_FRONTEND: noninteractive
      VERSION_INPUT: ${{ inputs.version }}
      # Push builds must not be redirected by a stale repository variable.
      # workflow_dispatch/workflow_call can still pin an explicit ref.
      TF_MANAGER_REF: ${{ inputs.tf_manager_ref || 'main' }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout Omni TF Manager
        uses: actions/checkout@v7.0.1
        with:
          repository: YanYaoyuan/omni_tf_manager
          ref: ${{ env.TF_MANAGER_REF }}
          path: omni_tf_manager_source
          token: ${{ secrets.OMNI_CI_REPO_TOKEN || github.token }}

      - name: Record Omni TF Manager revision
        run: echo "OMNI_TF_MANAGER_SHA=$(git -C omni_tf_manager_source rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Validate Vbot live sensor profile
        run: >-
          scripts/validate_vbot_tf_profile.sh
          omni_tf_manager_source/config/omni_vbot_dog.yaml

      - name: Clean workspace and caches before build
        run: |
          rm -rf "${ROS_WS}" \
            "${GITHUB_WORKSPACE}/build" "${GITHUB_WORKSPACE}/install" \
            "${GITHUB_WORKSPACE}/log" "${GITHUB_WORKSPACE}/dist" \
            /root/.cache/colcon /root/.cache/pip
          mkdir -p "${ROS_WS}/src"
          df -h

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git libeigen3-dev libpcl-dev libpython3-dev libqhull-dev \
            python3-colcon-common-extensions python3-matplotlib python3-rosdep \
            rsync shellcheck \
            ros-${ROS_DISTRO}-common-interfaces ros-${ROS_DISTRO}-octomap-ros \
            ros-${ROS_DISTRO}-pcl-conversions ros-${ROS_DISTRO}-pcl-ros \
            ros-${ROS_DISTRO}-tf2-eigen ros-${ROS_DISTRO}-tf2-geometry-msgs \
            ros-${ROS_DISTRO}-tf2-ros ros-${ROS_DISTRO}-visualization-msgs
          rosdep init || true
          rosdep update --rosdistro "${ROS_DISTRO}"

      - name: Prepare isolated colcon workspace
        run: |
          mkdir -p "${ROS_WS}/src/omni_slam" "${ROS_WS}/src/livox_ros_driver2/msg"
          rsync -a --delete \
            --exclude='/.git/' --exclude='/.github/' \
            --exclude='/build/' --exclude='/build_orin/' \
            --exclude='/install/' --exclude='/install_orin/' \
            --exclude='/dist/' --exclude='/log/' --exclude='/ros_logs/' \
            --exclude='/omni_tf_manager_source/' \
            "${GITHUB_WORKSPACE}/" "${ROS_WS}/src/omni_slam/"
          rsync -a --delete \
            --exclude='/.git/' --exclude='/build/' --exclude='/install/' --exclude='/log/' \
            "${GITHUB_WORKSPACE}/omni_tf_manager_source/" \
            "${ROS_WS}/src/omni_tf_manager/"
          cp .github/ci/livox_stub/package.xml "${ROS_WS}/src/livox_ros_driver2/"
          cp .github/ci/livox_stub/CMakeLists.txt "${ROS_WS}/src/livox_ros_driver2/"
          cp .github/ci/livox_stub/msg/*.msg "${ROS_WS}/src/livox_ros_driver2/msg/"
          test -f "${ROS_WS}/src/omni_slam/FAST_LIO/include/IKFoM_toolkit/mtk/build_manifold.hpp"

      - name: Install ROS dependencies
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          cd "${ROS_WS}"
          rosdep install --from-paths src --ignore-src --rosdistro "${ROS_DISTRO}" \
            --skip-keys livox_ros_driver2 -y
          apt-get clean
          rm -rf /var/lib/apt/lists/* /root/.cache/pip /root/.cache/colcon

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh omni_slam_manager/scripts/omni_slam_ctl

      - name: Build and test
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          cd "${ROS_WS}"
          colcon build --merge-install \
            --packages-select livox_ros_driver2 fast_lio icp_relocalization \
              omni_slam_interfaces omni_slam_manager \
              omni_tf_manager \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          source install/setup.bash
          colcon test --merge-install \
            --packages-select fast_lio icp_relocalization omni_slam_manager omni_tf_manager \
            --event-handlers console_direct+
          colcon test-result --verbose
          test -f install/share/omni_tf_manager/config/omni_dog.yaml
          test -f install/share/omni_tf_manager/config/omni_vbot_dog.yaml
          "${GITHUB_WORKSPACE}/scripts/validate_vbot_tf_profile.sh" \
            install/share/omni_tf_manager/config/omni_vbot_dog.yaml
          test -f install/share/fast_lio/config/omni_dog.yaml
          test -f install/share/fast_lio/config/vbot.yaml

      - name: Package runtime artifact
        if: github.event_name != 'pull_request'
        run: |
          version="${VERSION_INPUT:-${GITHUB_REF_NAME:-${GITHUB_SHA::12}}}"
          version="${version//\//-}"
          name="omni-slam-x86_64-${version}-${GITHUB_SHA::12}"
          mkdir -p "${GITHUB_WORKSPACE}/dist/${name}"
          cp -a "${ROS_WS}/install" "${GITHUB_WORKSPACE}/dist/${name}/install"
          .github/ci/write_manifest.sh x86_64 ubuntu-22.04 "${version}" \
            "${GITHUB_WORKSPACE}/dist/${name}"
          tar -C "${GITHUB_WORKSPACE}/dist" -czf \
            "${GITHUB_WORKSPACE}/dist/${name}.tar.gz" "${name}"
          sha256sum "${GITHUB_WORKSPACE}/dist/${name}.tar.gz" > \
            "${GITHUB_WORKSPACE}/dist/${name}.tar.gz.sha256"

      - name: Upload x86 runtime
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: omni-slam-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Upload colcon logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: x86-colcon-logs-${{ github.run_id }}
          path: /tmp/omni_slam_x86_ws/log
          retention-days: 2

      - name: Clean workspace and caches after build
        if: always()
        run: |
          rm -rf "${ROS_WS}" "${GITHUB_WORKSPACE}/build" \
            "${GITHUB_WORKSPACE}/install" "${GITHUB_WORKSPACE}/log" \
            /root/.cache/colcon /root/.cache/pip
          df -h
