name: Build RDK S100 (cross compile)

on:
  push:
    branches:
      - main

  workflow_dispatch:

  workflow_call:
    inputs:
      version:
        required: false
        type: string


concurrency:
  group: s100-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  packages: read


jobs:
  build:
    if: vars.OMNI_ENABLE_S100_BUILD == 'true'

    runs-on: ubuntu-22.04

    timeout-minutes: 120

    env:
      VERSION_INPUT: ${{ inputs.version }}

      S100_IMAGE: registry.d-robotics.cc/deliver/ai_toolchain_ubuntu_22_s100_s600_cpu:v3.7.0

      ROBOT_DEV_CONFIG_REF: f44b1ad2575b34c189fd470de1db9c5ad48b6886


    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout Omni SLAM
        uses: actions/checkout@v4


      # ============================================================
      # 2. Clean workspace
      # ============================================================

      - name: Clean workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "${GITHUB_WORKSPACE}/build" \
            "${GITHUB_WORKSPACE}/install" \
            "${GITHUB_WORKSPACE}/log" \
            "${GITHUB_WORKSPACE}/dist" \
            "${RUNNER_TEMP}/s100-cross"

          docker builder prune --all --force || true
          docker image prune --all --force || true

          echo
          echo "=== Disk usage ==="
          df -h


      # ============================================================
      # 3. Free GitHub Runner disk space
      # ============================================================

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true

          docker system prune -af || true

          echo
          echo "=== Disk usage after cleanup ==="
          df -h


      # ============================================================
      # 4. Login D-Robotics Registry
      #
      # 注意：
      # 测试阶段可以先写死。
      # 后续建议改成 GitHub Secrets。
      # ============================================================

      - name: Login D-Robotics Registry
        shell: bash
        run: |
          set -euo pipefail

          echo 'VLaeatrjF9yGf6I44trT74zKhUpZSVlr' | \
            docker login registry.d-robotics.cc \
              -u 'ccr$deliver-ronly' \
              --password-stdin


      # ============================================================
      # 5. Pull official S100 toolchain image
      # ============================================================

      - name: Pull official S100 toolchain image
        shell: bash
        run: |
          set -euo pipefail

          docker pull "${S100_IMAGE}"

          echo
          echo "=== Toolchain image ==="

          docker image inspect "${S100_IMAGE}" \
            --format='ID={{.Id}} ARCH={{.Architecture}} OS={{.Os}}'


      # ============================================================
      # 6. Prepare D-Robotics workspace
      #
      # Final layout:
      #
      # s100-cross/
      # └── cc_ws/
      #     ├── sysroot_docker/
      #     └── tros_ws/
      #         ├── robot_dev_config/
      #         └── src/
      #             └── omni_slam/
      #
      # sysroot_docker will be cloned by ros2.repos.
      # ============================================================

      - name: Prepare D-Robotics build workspace
        shell: bash
        run: |
          set -euo pipefail

          root="${RUNNER_TEMP}/s100-cross/cc_ws/tros_ws"

          echo "S100 workspace:"
          echo "${root}"

          mkdir -p "${root}/src"


          # --------------------------------------------------------
          # Clone official robot_dev_config
          # --------------------------------------------------------

          git clone \
            --filter=blob:none \
            https://github.com/D-Robotics/robot_dev_config.git \
            "${root}/robot_dev_config"


          git -C "${root}/robot_dev_config" \
            checkout \
            --detach \
            "${ROBOT_DEV_CONFIG_REF}"


          echo
          echo "robot_dev_config revision:"

          git -C "${root}/robot_dev_config" \
            rev-parse HEAD


          # --------------------------------------------------------
          # Copy Omni SLAM repository into TROS workspace
          # --------------------------------------------------------

          mkdir -p "${root}/src/omni_slam"

          rsync -a \
            --delete \
            --exclude='/.git/' \
            --exclude='/build/' \
            --exclude='/build_orin/' \
            --exclude='/install/' \
            --exclude='/install_orin/' \
            --exclude='/log/' \
            --exclude='/dist/' \
            "${GITHUB_WORKSPACE}/" \
            "${root}/src/omni_slam/"


          # --------------------------------------------------------
          # Verify FAST-LIO source
          # --------------------------------------------------------

          test -f \
            "${root}/src/omni_slam/FAST_LIO/include/IKFoM_toolkit/mtk/build_manifold.hpp"


          # --------------------------------------------------------
          # Export workspace path
          # --------------------------------------------------------

          echo "S100_CROSS_ROOT=${root}" \
            >> "${GITHUB_ENV}"


          echo
          echo "=== Workspace structure ==="

          find "${RUNNER_TEMP}/s100-cross/cc_ws" \
            -maxdepth 3 \
            -type d \
            | sort


      # ============================================================
      # 7. Generate CI-safe ros2.repos
      #
      # D-Robotics ros2.repos contains:
      #
      #   speech_agent_asr
      #   speech_agent_audio
      #   speech_agent_tts
      #
      # These repos currently require GitHub authentication.
      #
      # Omni SLAM does not depend on them, so remove them before
      # vcs import.
      #
      # IMPORTANT:
      #
      # Do this OUTSIDE docker run.
      #
      # This avoids nested bash/heredoc indentation problems.
      # ============================================================

      - name: Prepare filtered ros2.repos
        shell: bash
        run: |
          set -euo pipefail

          root="${RUNNER_TEMP}/s100-cross/cc_ws/tros_ws"

          echo
          echo "=== Install PyYAML on GitHub Runner ==="

          python3 -m pip install \
            --user \
            --disable-pip-version-check \
            pyyaml


          echo
          echo "=== Filter ros2.repos ==="

          python3 - <<'PY'
          import os
          import yaml

          root = os.path.join(
              os.environ["RUNNER_TEMP"],
              "s100-cross",
              "cc_ws",
              "tros_ws",
          )

          source = os.path.join(
              root,
              "robot_dev_config",
              "ros2.repos",
          )

          target = os.path.join(
              root,
              "robot_dev_config",
              "ros2-ci.repos",
          )

          remove_names = {
              "speech_agent_asr",
              "speech_agent_audio",
              "speech_agent_tts",
          }

          with open(source, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          repositories = data.get("repositories", {})

          print("Original repository count:", len(repositories))

          removed = []

          for key in list(repositories.keys()):
              basename = key.rstrip("/").split("/")[-1]

              if basename in remove_names:
                  print("Removing unavailable repository:", key)
                  removed.append(key)
                  del repositories[key]

          if not removed:
              print("WARNING: no speech_agent repositories were found")

          print("Removed repository count:", len(removed))
          print("Remaining repository count:", len(repositories))

          with open(target, "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  data,
                  f,
                  sort_keys=False,
                  allow_unicode=True,
              )

          print("Generated:", target)
          PY


          echo
          echo "=== Verify speech_agent repos are removed ==="

          if grep -n "speech_agent_" \
            "${root}/robot_dev_config/ros2-ci.repos"; then

            echo
            echo "ERROR: speech_agent repositories still exist."
            exit 1

          else

            echo "OK: speech_agent repositories removed."

          fi


          echo
          echo "=== ros2-ci.repos ==="

          head -80 \
            "${root}/robot_dev_config/ros2-ci.repos"


      # ============================================================
      # 8. Cross compile S100
      # ============================================================

      - name: Cross compile S100
        shell: bash
        run: |
          set -euo pipefail

          docker run \
            --rm \
            --network host \
            -v "${RUNNER_TEMP}/s100-cross:/mnt/s100-cross" \
            -w /mnt/s100-cross/cc_ws/tros_ws \
            "${S100_IMAGE}" \
            bash -lc '

              set -euo pipefail


              echo "========================================"
              echo "S100 cross compilation"
              echo "========================================"

              echo
              echo "Workspace:"

              pwd


              # ====================================================
              # Check robot_dev_config
              # ====================================================

              echo
              echo "=== Check robot_dev_config ==="

              test -f robot_dev_config/build.sh
              test -f robot_dev_config/s100_build.sh
              test -f robot_dev_config/aarch64_toolchainfile.cmake
              test -f robot_dev_config/ros2-ci.repos


              # ====================================================
              # Install vcstool
              # ====================================================

              echo
              echo "=== Prepare vcstool ==="

              if ! command -v vcs >/dev/null 2>&1; then

                echo "vcstool not found, installing..."

                pip3 install \
                  --no-cache-dir \
                  vcstool

              fi


              echo
              echo "vcs path:"

              command -v vcs

              vcs --version || true


              # ====================================================
              # Disk before dependencies
              # ====================================================

              echo
              echo "=== Disk before dependency import ==="

              df -h


              # ====================================================
              # Import ROS / TROS dependencies
              #
              # ros2-ci.repos still contains:
              #
              # ../../sysroot_docker
              #
              # so sysroot will automatically appear at:
              #
              # /mnt/s100-cross/cc_ws/sysroot_docker
              # ====================================================

              echo
              echo "=== Import ROS/TROS dependencies ==="

              vcs import \
                --recursive \
                src \
                < robot_dev_config/ros2-ci.repos


              echo
              echo "=== Dependency import completed ==="


              # ====================================================
              # Verify sysroot
              # ====================================================

              echo
              echo "=== Verify S100 sysroot ==="

              test -d ../sysroot_docker


              echo "Sysroot path:"

              realpath ../sysroot_docker


              test -d ../sysroot_docker/usr


              echo
              echo "=== Sysroot top-level ==="

              ls -lah ../sysroot_docker \
                | head -50


              # ====================================================
              # Verify TROS ARM build repository
              # ====================================================

              echo
              echo "=== Verify tros_arm_build ==="

              test -d ../tros_arm_build || true

              find .. \
                -maxdepth 2 \
                -type d \
                -name "*arm_build*" \
                -print


              # ====================================================
              # Disk after dependencies
              # ====================================================

              echo
              echo "=== Disk after dependency import ==="

              df -h


              # ====================================================
              # Show Omni packages
              # ====================================================

              echo
              echo "=== Omni ROS packages ==="

              find src/omni_slam \
                -name package.xml \
                -print


              # ====================================================
              # Build
              # ====================================================

              echo
              echo "========================================"
              echo "Build RDK S100"
              echo "========================================"


              bash robot_dev_config/build.sh \
                -p S100 \
                -c "-DUSE_LIVOX_CUSTOM_MSG=OFF" \
                -r "--packages-up-to \
                fast_lio \
                icp_relocalization \
                omni_slam_interfaces \
                omni_slam_manager"


              # ====================================================
              # Verify build
              # ====================================================

              echo
              echo "========================================"
              echo "S100 build completed"
              echo "========================================"


              test -d install


              echo
              echo "=== Install size ==="

              du -sh install


              echo
              echo "=== Install content ==="

              find install \
                -maxdepth 2 \
                -type d \
                | head -100

            '


      # ============================================================
      # 9. Verify generated binary architecture
      #
      # Ensures x86 ELF did not accidentally get packaged.
      # ============================================================

      - name: Verify ARM64 binaries
        shell: bash
        run: |
          set -euo pipefail

          test -d "${S100_CROSS_ROOT}/install"

          echo
          echo "=== Install size ==="

          du -sh "${S100_CROSS_ROOT}/install"


          echo
          echo "=== ELF architecture check ==="

          count=0

          while IFS= read -r file_path
          do

            info="$(file "${file_path}")"

            if echo "${info}" | grep -q "ELF"; then

              echo "${info}"

              count=$((count + 1))


              if ! echo "${info}" | \
                grep -Eq \
                "ARM aarch64|ARM64|aarch64"; then

                echo
                echo "ERROR: Non-ARM64 binary detected:"
                echo "${file_path}"
                echo

                exit 1

              fi

            fi


            if [[ "${count}" -ge 50 ]]; then
              break
            fi

          done < <(
            find "${S100_CROSS_ROOT}/install" \
              -type f \
              -perm /111
          )


          if [[ "${count}" -eq 0 ]]; then

            echo
            echo "WARNING: No executable ELF files found."

          else

            echo
            echo "Checked ARM64 ELF files: ${count}"

          fi


      # ============================================================
      # 10. Package S100 runtime
      # ============================================================

      - name: Package S100 runtime
        shell: bash
        run: |
          set -euo pipefail

          test -d "${S100_CROSS_ROOT}/install"


          # --------------------------------------------------------
          # Resolve version
          # --------------------------------------------------------

          version="${VERSION_INPUT:-}"


          if [[ -z "${version}" ]]; then

            if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then

              version="${GITHUB_REF_NAME}"

            else

              version="${GITHUB_SHA::12}"

            fi

          fi


          version="${version//\//-}"


          # --------------------------------------------------------
          # Package name
          # --------------------------------------------------------

          name="omni-slam-rdk-s100-aarch64-${version}-${GITHUB_SHA::12}"


          echo
          echo "Package name:"
          echo "${name}"


          # --------------------------------------------------------
          # Prepare dist
          # --------------------------------------------------------

          mkdir -p "dist/${name}"


          # --------------------------------------------------------
          # Copy install tree
          # --------------------------------------------------------

          cp -a \
            "${S100_CROSS_ROOT}/install" \
            "dist/${name}/install"


          # --------------------------------------------------------
          # Write manifest
          # --------------------------------------------------------

          if [[ -x ".github/ci/write_manifest.sh" ]]; then

            .github/ci/write_manifest.sh \
              aarch64 \
              rdk-s100-rdkos-4 \
              "${version}" \
              "dist/${name}"

          elif [[ -f ".github/ci/write_manifest.sh" ]]; then

            bash .github/ci/write_manifest.sh \
              aarch64 \
              rdk-s100-rdkos-4 \
              "${version}" \
              "dist/${name}"

          else

            echo "WARNING: .github/ci/write_manifest.sh not found"

            cat > "dist/${name}/manifest.txt" <<EOF
platform=rdk-s100-rdkos-4
arch=aarch64
version=${version}
commit=${GITHUB_SHA}
EOF

          fi


          # --------------------------------------------------------
          # Create archive
          # --------------------------------------------------------

          tar \
            -C dist \
            -czf "dist/${name}.tar.gz" \
            "${name}"


          # --------------------------------------------------------
          # SHA256
          # --------------------------------------------------------

          sha256sum \
            "dist/${name}.tar.gz" \
            > "dist/${name}.tar.gz.sha256"


          echo
          echo "========================================"
          echo "Release artifacts"
          echo "========================================"

          ls -lh \
            "dist/${name}.tar.gz" \
            "dist/${name}.tar.gz.sha256"


      # ============================================================
      # 11. Upload artifact
      # ============================================================

      - name: Upload S100 artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-slam-rdk-s100-aarch64

          path: |
            dist/*.tar.gz
            dist/*.sha256

          if-no-files-found: error

          retention-days: 3


      # ============================================================
      # 12. Cleanup
      # ============================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf \
            "${GITHUB_WORKSPACE}/build" \
            "${GITHUB_WORKSPACE}/install" \
            "${GITHUB_WORKSPACE}/log" \
            "${RUNNER_TEMP}/s100-cross"

          docker logout registry.d-robotics.cc || true

          docker builder prune \
            --all \
            --force || true

          docker image prune \
            --all \
            --force || true

          echo
          echo "=== Final disk usage ==="

          df -h