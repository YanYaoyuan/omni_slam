name: Build RDK S100 (cross compile)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional)"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        type: string

concurrency:
  group: s100-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: vars.OMNI_ENABLE_S100_BUILD == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      VERSION_INPUT: ${{ inputs.version }}
      S100_IMAGE: pc_tros_ubuntu22.04:v1.0.0
      S100_IMAGE_URL: http://archive.d-robotics.cc/TogetheROS/cross_compile_docker/pc_tros_ubuntu22.04_v1.0.0.tar.gz
      S100_IMAGE_SHA256: ec065c268782373311421f0bb7f2212bfec6584a7070a9737468055a6bce2c88
      ROBOT_DEV_CONFIG_REF: f44b1ad2575b34c189fd470de1db9c5ad48b6886
      S100_SYSROOT_REF: de9fa286f71a72d24c349477cd59f41cc2cc3d8f

    steps:
      - name: Checkout Omni SLAM
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            || true

          docker system prune --all --force || true
          df -h

      - name: Load official TROS cross-compilation image
        shell: bash
        run: |
          set -euo pipefail

          image_archive="${RUNNER_TEMP}/pc_tros_ubuntu22.04_v1.0.0.tar.gz"
          curl --fail --location \
            --retry 5 --retry-all-errors --continue-at - \
            --output "${image_archive}" \
            "${S100_IMAGE_URL}"
          echo "${S100_IMAGE_SHA256}  ${image_archive}" | sha256sum --check
          docker load --input "${image_archive}"
          docker image inspect "${S100_IMAGE}" \
            --format='ID={{.Id}} ARCH={{.Architecture}} OS={{.Os}}'

      - name: Cross compile S100
        shell: bash
        run: |
          set -euo pipefail

          export S100_SOURCE_ROOT="${GITHUB_WORKSPACE}"
          export S100_WORK_ROOT="${RUNNER_TEMP}/s100-cross"
          export S100_CLEAN=1

          ./scripts/build_s100_cross.sh

          cross_root="${S100_WORK_ROOT}/cc_ws/tros_ws"
          echo "S100_CROSS_ROOT=${cross_root}" >> "${GITHUB_ENV}"

      - name: Package S100 runtime
        shell: bash
        run: |
          set -euo pipefail

          runtime_root="${S100_CROSS_ROOT}/runtime"
          test -x "${runtime_root}/bin/fastlio_mapping"
          test -x "${runtime_root}/bin/icp_node"
          test -d "${runtime_root}/config/fast_lio"
          test -s "${runtime_root}/lib/DEPENDENCIES.txt"

          version="${VERSION_INPUT:-}"
          if [[ -z "${version}" ]]; then
            if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
              version="${GITHUB_REF_NAME}"
            else
              version="${GITHUB_SHA::12}"
            fi
          fi

          version="${version//\//-}"
          name="omni-slam-rdk-s100-aarch64-${version}-${GITHUB_SHA::12}"

          mkdir -p "dist/${name}"
          cp -a "${runtime_root}/." "dist/${name}/"

          .github/ci/write_manifest.sh \
            aarch64 \
            rdk-s100-rdkos-4 \
            "${version}" \
            "dist/${name}"

          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ls -lh "dist/${name}.tar.gz"

      - name: Upload S100 artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-slam-rdk-s100-aarch64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_WORKSPACE}"
          test -n "${RUNNER_TEMP}"

          # The official toolchain container writes the mounted build tree as
          # root on GitHub-hosted runners. Use sudo for deterministic cleanup.
          sudo rm -rf \
            "${GITHUB_WORKSPACE}/dist" \
            "${RUNNER_TEMP}/s100-cross"

          docker system prune --all --force || true
          df -h
